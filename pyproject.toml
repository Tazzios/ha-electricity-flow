[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP", "W", "SIM", "RUF"]
ignore = ["RUF001"]  # the names use an en dash on purpose

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
section-order = ["future", "standard-library", "third-party", "homeassistant", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
homeassistant = ["homeassistant"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
files = ["custom_components/electricity_flow"]
